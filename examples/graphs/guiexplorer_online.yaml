kind: agent_graph
policies: &budget {max_steps: 31, max_activations: 1508}
nodes:
  input: {kind: input}
  online:
    loop:
      inputs: &inputs {task: task, value: value}
      outputs: &outputs {result: result}
      until: {field: result.finished, operator: truthy}
      max_iterations: 31
      max_activations: 1488
      body:
        inputs: *inputs
        outputs: *outputs
        max_activations: 48
        graph:
          policies: *budget
          nodes:
            input: {kind: input}
            previous: {state: {key: guiexplorer_episode, data_type: m3a_frame, scope: run, operation: read}}
            resume: {component: 'agent.memory:m3a_resume', contract: {id: zhixing.m3a.resume, version: '1.0'}}
            history: {component: 'agent.memory:guiexplorer_history', contract: {id: zhixing.guiexplorer.history, version: '1.0'}}
            ready: {component: 'agent.memory:m3a_pass', contract: {id: zhixing.m3a.ready, version: '1.0'}}
            finish_round: &pass {component: 'agent.memory:m3a_pass', contract: {id: zhixing.m3a.pass, version: '1.0'}}
            skip_round: *pass
            failed_round: *pass
            observe_before: {component: 'agent.perception:guiexplorer_observe', contract: {id: zhixing.guiexplorer.observe, version: '1.0'}}
            perceive_before: {component: 'agent.perception:guiexplorer_perception', role: perception, contract: {id: zhixing.guiexplorer.perceive, version: '1.0'}}
            retrieve: {component: 'agent.memory:guiexplorer_retrieve', role: memory, contract: {id: zhixing.guiexplorer.retrieve, version: '1.0'}, dependencies: {retrieval: {namespace: knowledge, name: guiexplorer_retrieval, params: {}}}}
            rank: {component: 'agent.reasoning:guiexplorer_rank', role: reasoning, contract: {id: zhixing.guiexplorer.rank, version: '1.0'}, dependencies: &model {llm: {namespace: llm, name: guiexplorer_llm, params: {}}}}
            select: {component: 'agent.reasoning:guiexplorer_select', role: reasoning, contract: {id: zhixing.guiexplorer.select, version: '1.0'}, dependencies: *model}
            execute: {component: 'agent.action_executor:guiexplorer_execute', role: action_executor, contract: {id: zhixing.guiexplorer.execute, version: '1.0'}, primary: true}
            observe_after: {component: 'agent.perception:guiexplorer_observe', contract: {id: zhixing.guiexplorer.observe, version: '1.0'}, params: {after: true}}
            perceive_after: {component: 'agent.perception:guiexplorer_perception', role: perception, contract: {id: zhixing.guiexplorer.perceive, version: '1.0'}, params: {after: true}}
            summary: {component: 'agent.reasoning:guiexplorer_summary', role: reasoning, contract: {id: zhixing.guiexplorer.summary, version: '1.0'}, dependencies: *model}
            commit: {component: 'agent.memory:m3a_commit', contract: {id: zhixing.m3a.commit, version: '1.0'}}
            wait_round: {component: 'agent.perception:guiexplorer_wait_round', contract: {id: zhixing.guiexplorer.wait_round, version: '1.0'}}
            memory: {component: 'agent.memory:sliding_window_memory', role: memory, contract: {id: zhixing.memory.fragments, version: '1.0'}, params: {window_size: 30}, lifecycle: stateful}
            start: {router: {cases: [{id: finish, predicate: {field: route, operator: eq, value: finish}}], default: continue}}
            decision: {router: {cases: [{id: execute, predicate: {field: route, operator: eq, value: execute}}], default: skip}}
            executed: {router: {cases: [{id: ok, predicate: {field: route, operator: eq, value: executed}}], default: failed}}
            save: {state: {key: guiexplorer_episode, data_type: m3a_frame, scope: run, operation: write}}
            output: {kind: output}
          edges: [
            input.value -> previous.control, input.task -> resume.task, previous.value -> resume.previous,
            resume.frame -> history.frame, resume.frame -> ready.frame, memory.context -> ready.memory,
            ready.result -> start.value, ready.result -> finish_round.frame, finish_round.result -> commit.values,
            ready.result -> observe_before.frame, observe_before.observation -> perceive_before.observation,
            perceive_before.view -> retrieve.view, resume.frame -> rank.frame, retrieve.knowledge -> rank.knowledge,
            rank.ranked -> select.knowledge, resume.frame -> select.frame, memory.context -> select.memory,
            select.result -> decision.value, select.result -> skip_round.frame, skip_round.result -> commit.values,
            select.result -> execute.frame, execute.result -> executed.value,
            execute.result -> failed_round.frame, failed_round.result -> commit.values,
            execute.result -> observe_after.frame, observe_after.observation -> perceive_after.observation,
            execute.result -> summary.frame, perceive_after.view -> summary.view, summary.result -> commit.values,
            commit.result -> wait_round.frame, wait_round.result -> save.write, save.value -> output.result,
            {source: history.fragment, target: memory.write, condition: {field: content, operator: exists}},
            {source: start.finish, target: finish_round.control, kind: control},
            {source: start.continue, target: observe_before.control, kind: control},
            {source: decision.skip, target: skip_round.control, kind: control},
            {source: decision.execute, target: execute.control, kind: control},
            {source: executed.failed, target: failed_round.control, kind: control},
            {source: executed.ok, target: observe_after.control, kind: control},
            {source: executed.ok, target: summary.control, kind: control}]
  finish: {component: 'agent.memory:guiexplorer_finish', contract: {id: zhixing.guiexplorer.finish, version: '1.0'}}
  output: {kind: output}
edges:
  - input.task -> online.task
  - input.value -> online.value
  - online.result -> finish.frame
  - finish.result -> output.result
